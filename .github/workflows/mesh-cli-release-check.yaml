name: Mesh CLI release check

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-release:
    name: Check pinned Mesh CLI release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout harmony
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          persist-credentials: false

      - name: Compare pin with latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          dockerfile=test/localnet.Dockerfile
          current_version=$(sed -n 's/^ARG MESH_CLI_VERSION=//p' "$dockerfile")
          current_ref=$(sed -n 's/^ARG MESH_CLI_REF=//p' "$dockerfile")
          test -n "$current_version"
          test -n "$current_ref"

          latest_version=$(gh api repos/coinbase/mesh-cli/releases/latest --jq .tag_name)
          latest_ref=$(gh api "repos/coinbase/mesh-cli/commits/$latest_version" --jq .sha)

          if [[ "$current_version" != "$latest_version" || "$current_ref" != "$latest_ref" ]]; then
            echo "::error title=Mesh CLI release is stale::Pinned $current_version ($current_ref), latest is $latest_version ($latest_ref)"
            exit 1
          fi

          echo "Mesh CLI pin is current: $current_version ($current_ref)"
